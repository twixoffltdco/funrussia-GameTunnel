
services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: funrussia-game-tunnel
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - SERVERURL=${SERVERURL}
      - SERVERPORT=51820
      - PEERS=iphone
      - PEERDNS=1.1.1.1
      - INTERNAL_SUBNET=10.77.0.0
      - ALLOWEDIPS=185.207.214.14/32
    volumes:
      - ./config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
